<!DOCTYPE html>
<html>
<head>
    <title>Smartly | Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .highlight {
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }
        
        p {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .coming-soon {
            font-size: 4rem;
            font-weight: bold;
            color: #00ff9d;
            margin: 30px 0;
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
            animation: pulse 2s infinite;
        }
        
        .status {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 10px;
            margin: 30px 0;
            border-left: 4px solid #00ff9d;
        }
        
        .status p {
            margin: 10px 0;
            font-size: 1rem;
        }
        
        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .coming-soon { font-size: 3rem; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
       
        <h1><span class="highlight">mySmartly</span></h1>
        
        <div class="coming-soon">Coming Soon!</div>
        
        <p>We're building something amazing. Stay tuned for our launch!</p>
        
       
        
        <p>Something great is on the way. We can't wait to share it with you!</p>
    </div>
</body>
</html>
